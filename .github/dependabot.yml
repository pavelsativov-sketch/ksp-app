version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Патчи безопасности и миноры — одним PR, чтобы не засорять.
      minor-patch:
        update-types: ["minor", "patch"]
      majors:
        update-types: ["major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
